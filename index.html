<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=https://iq.merngil.com" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://iq.merngil.com" />
  <title>Redirecting to iq.merngil.com</title>
  <script>
    window.location.replace("https://iq.merngil.com");
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --text: #f8fafc;
      --accent: #38bdf8;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(148, 163, 184, 0.15);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --text: #0f172a;
        --accent: #0284c7;
        --card-bg: rgba(255, 255, 255, 0.8);
        --border: rgba(148, 163, 184, 0.25);
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 1.5rem;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.5;
      opacity: 0.85;
      margin-bottom: 1.5rem;
    }
    a {
      display: inline-block;
      color: #ffffff;
      background: var(--accent);
      text-decoration: none;
      font-weight: 500;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      transition: opacity 0.2s ease;
    }
    a:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Redirecting...</h1>
    <p>We are taking you to <strong>iq.merngil.com</strong>.</p>
    <p>
      <a href="https://iq.merngil.com" id="redirect-link">Click here if you are not redirected</a>
    </p>
  </div>
</body>
</html>
